<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Returns Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-card">
        <h2>Gold / Silver Returns Calculator</h2>

        <div class="input-grid" id="inputGrid">
            <!-- Purchase Details -->
            <div class="input-group">
                <label for="goldWeight">Weight (in gm)<span class="required">*</span></label>
                <input type="text" id="goldWeight" inputmode="numeric" placeholder="e.g. 30">
            </div>

            <div class="input-group">
                <label for="purchaseRate">Purchase Rate (per gm)<span class="required">*</span></label>
                <input type="text" id="purchaseRate" inputmode="numeric" placeholder="e.g. 10,000">
            </div>

            <div class="input-group">
                <label for="makingCharges">Making Charges (₹)<span class="required">*</span></label>
                <input type="text" id="makingCharges" inputmode="numeric" placeholder="e.g. 2,000">
            </div>

            <div class="input-group">
                <label for="gstAmount">GST (in %)</label>
                <input type="text" id="gstAmount" inputmode="numeric" placeholder="e.g. 3">
            </div>

            <!-- Timing -->
            <div class="input-group">
                <label>Purchase Date<span class="required">*</span></label>
                <div class="date-row">
                    <select id="pYear"><option value="" disabled selected>Year</option></select>
                    <select id="pMonth">
                        <option value="" disabled selected>Month</option>
                        <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
                        <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
                        <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option>
                        <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">
                <label>Sale Date<span class="required">*</span></label>
                <div class="date-row">
                    <select id="sYear"><option value="" disabled selected>Year</option></select>
                    <select id="sMonth">
                        <option value="" disabled selected>Month</option>
                        <option value="0">Jan</option><option value="1">Feb</option><option value="2">Mar</option>
                        <option value="3">Apr</option><option value="4">May</option><option value="5">Jun</option>
                        <option value="6">Jul</option><option value="7">Aug</option><option value="8">Sep</option>
                        <option value="9">Oct</option><option value="10">Nov</option><option value="11">Dec</option>
                    </select>
                </div>
            </div>

            <!-- Sale Details -->
            <div class="input-group">
                <label for="saleRate">Sale Rate (per gm)<span class="required">*</span></label>
                <input type="text" id="saleRate" inputmode="numeric" placeholder="e.g. 15,000">
            </div>

            <div class="input-group">
                <label for="saleBrokerage">Deductions (₹)</label>
                <input type="text" id="saleBrokerage" inputmode="numeric" placeholder="e.g. 500">
            </div>
        </div>

        <div id="error-message" style="color: #d9534f; font-size: 0.9rem; margin-bottom: 10px; display: none; text-align: center; font-weight: bold;">
            Sale date must be after purchase date.
        </div>

        <button class="calc-btn" onclick="calculate()"><b>Calculate</b></button>

        <div class="results" id="results" style="display: none;">
            <div class="result-item">
                <span>Investment Amount:</span>
                <span id="totalInvestment">₹0</span>
            </div>
            <div class="result-item">
                <span>Sale Value:</span>
                <span id="totalSale">₹0</span>
            </div>
            <div class="result-item">
                <span>Annual Returns:</span>
                <span id="annualReturns">0%</span>
            </div>
            <div class="result-item total">
                <span>Real Returns:<br>(Adjusted for Inflation - 6%)</span>
                <span id="realReturns">0%</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
